<title>Cora's工作台</title>
<style>
* { margin:0; padding:0; box-sizing:border-box; }
:root {
  --bg:#D0DCEC;
  --card:#FFFFFF;
  --paper:#FFFFFF;
  --sidebar-bg:#E2EDF6;
  --sidebar-text:#5E738C;
  --sidebar-active:#5B9BFF;
  --sidebar-active-text:#3D6FD8;
  --primary:#5B9BFF;
  --primary-light:#E4F0FA;
  --primary-dark:#3D7EF0;
  --accent:#7ED0C8;
  --gold:#F2C14E;
  --text:#3A4556;
  --muted:#7F90A4;
  --border:#C5D6E6;
  --rule:#C5D6E6;
  --green:#3DB8A0; --green-light:#E5F8F4;
  --amber:#E0A54B; --amber-light:#FFF4E0;
  --red:#F07167; --red-light:#FFE8E6;
  --radius:22px; --radius-sm:14px;
  --sidebar-w:240px;
  --shadow:0 12px 32px rgba(90,130,175,.13), 0 3px 10px rgba(90,130,175,.08);
  --shadow-md:0 18px 44px rgba(90,130,175,.16), 0 6px 16px rgba(90,130,175,.10);
  --shadow-lg:0 22px 48px rgba(90,130,175,.16);
  --font-ui:"Kaiti SC","STKaiti","KaiTi","楷体","Songti SC",serif;
  --font-kai:"Kaiti SC","STKaiti","KaiTi","楷体","Songti SC",serif;
  --font-mono:"SF Mono",Menlo,Consolas,monospace;
}
html,body { height:100%; font-family:var(--font-kai); background:var(--bg); color:var(--text); font-size:15px; line-height:1.75; -webkit-font-smoothing:antialiased; }
body {
  background:
    radial-gradient(900px 440px at 8% -8%, rgba(255,255,255,.72), transparent 55%),
    radial-gradient(680px 380px at 100% 0%, rgba(145,185,230,.26), transparent 50%),
    linear-gradient(180deg,#D0DCEC 0%, #D8E5F2 46%, #E2EDF6 100%);
}
.ambient { display:block; pointer-events:none; position:fixed; inset:0; z-index:0; overflow:hidden; }
.orb { position:absolute; border-radius:50%; filter:blur(64px); opacity:.45; }
.orb-a { width:340px; height:340px; background:#B9D0E8; top:-90px; right:8%; }
.orb-b { width:260px; height:260px; background:#C8D8EC; bottom:6%; left:22%; }
.orb-c { width:200px; height:200px; background:#D6E4F2; top:46%; right:-50px; }

#app { display:flex; height:100vh; position:relative; z-index:1; }

/* Sidebar */
#sidebar {
  width:var(--sidebar-w); display:flex; flex-direction:column; overflow-y:auto; flex-shrink:0;
  background:linear-gradient(180deg, rgba(255,255,255,.88), rgba(226,237,246,.94));
  backdrop-filter:blur(20px); -webkit-backdrop-filter:blur(20px);
  border-right:1px solid rgba(255,255,255,.75);
  box-shadow:10px 0 36px rgba(90,130,175,.10);
}
.sidebar-foot { margin-top:auto; text-align:center; padding:14px 16px 18px; font-size:22px; }
.sync-btn { display:inline-flex; align-items:center; justify-content:center; width:100%; margin-bottom:8px; padding:8px 12px; border:none; border-radius:999px; cursor:pointer; font-family:var(--font-kai); font-size:14px; font-weight:650; color:#3D7EF0; background:rgba(255,255,255,.8); box-shadow:0 6px 14px rgba(90,130,175,.12); }
.sync-status { font-size:12px; color:var(--muted); margin-bottom:8px; line-height:1.4; }
.sync-modal { position:fixed; inset:0; z-index:90; background:rgba(44,58,79,.38); display:flex; align-items:center; justify-content:center; padding:24px; }
.sync-modal[hidden] { display:none; }
.sync-card { width:min(440px,100%); background:#fff; border-radius:22px; padding:22px; box-shadow:var(--shadow-lg); }
.sync-card p { color:var(--muted); font-size:14px; margin:8px 0 12px; }
.sync-card input { width:100%; margin-bottom:12px; }
.edit-hit, .ddl-item, .list-item, .check-row, .habit-card, .recipe-card, .paper-card { cursor:pointer; }
.edit-hit:hover, .ddl-item:hover .text, .list-item:hover .text { color:#3D7EF0; }
.btn-edit { color:#3D7EF0; background:#E8F1FF; }
.sync-modal { z-index:200; }
.edit-lab { display:block; font-size:13px; color:var(--muted); margin:10px 0 4px; }
#edit-fields input, #edit-fields select, #edit-fields textarea { width:100%; }
.sidebar-header { padding:28px 18px 12px; text-align:center; }
.brand { display:flex; flex-direction:column; align-items:center; gap:8px; }
.brand-seal {
  width:78px; height:78px; border-radius:50%; display:flex; align-items:center; justify-content:center;
  padding:3px; background:linear-gradient(145deg,#fff 0%, #C5DCFF 55%, #7EB6FF 100%);
  box-shadow:0 10px 22px rgba(126,182,255,.28), inset 0 1px 0 #fff; overflow:hidden;
}
.brand-seal img { width:100%; height:100%; object-fit:cover; object-position:50% 12%; display:block; border-radius:50%; }
.hello-deco { display:flex; flex-direction:column; align-items:center; gap:8px; position:relative; z-index:1; flex-shrink:0; }
.hello-avatar-wrap {
  width:96px; height:96px; min-width:96px; min-height:96px; max-width:96px; max-height:96px;
  border-radius:50%; padding:3px; box-sizing:border-box;
  background:linear-gradient(145deg,#fff,#C5DCFF,#7EB6FF);
  box-shadow:0 12px 24px rgba(126,182,255,.25);
}
.hello-avatar-wrap img, img.hello-avatar {
  width:90px; height:90px; object-fit:cover; object-position:50% 12%; border-radius:50%; display:block;
}
.sidebar-header h1 {
  font-size:22px; font-weight:650; letter-spacing:0.06em;
  background:linear-gradient(180deg,#5B9BFF,#3D7EF0);
  -webkit-background-clip:text; background-clip:text; color:transparent;
}
.sidebar-header p { font-size:12px; color:var(--muted); margin-top:2px; }
.nav-kicker { display:none; }
.nav-item { display:flex; align-items:center; gap:12px; padding:11px 16px; margin:5px 14px; cursor:pointer; color:var(--sidebar-text); font-size:16px; border-radius:18px; background:rgba(255,255,255,.65); transition:background .18s, color .18s, transform .18s, box-shadow .18s; }
.nav-item:hover { background:rgba(255,255,255,.9); color:var(--text); transform:translateX(3px); }
.nav-item.active { background:linear-gradient(135deg,#7EB6FF,#4C8DFF); color:#fff; font-weight:650; box-shadow:0 10px 22px rgba(76,141,255,.30), inset 0 1px 0 rgba(255,255,255,.4); transform:translateX(0); }
.nav-item.active .nav-icon { filter:none; }
.nav-icon { width:26px; height:26px; display:flex; align-items:center; justify-content:center; font-size:20px; color:inherit; opacity:1; }
.ico { display:block; flex-shrink:0; }

/* Main */
#main { flex:1; overflow-y:auto; }
.topbar { display:none; }
.topbar h2 { font-size:22px; font-weight:500; letter-spacing:0.06em; }
.topbar .date { font-size:13px; color:var(--muted); }
#content { padding:28px 32px 56px; max-width:1080px; margin:0 auto; }

.hello {
  position:relative; overflow:hidden;
  background:linear-gradient(135deg, #FFFFFF 0%, #E8F0F8 55%, #D7E6F4 100%);
  border-radius:28px; padding:24px 28px; margin-bottom:18px;
  border:1px solid rgba(255,255,255,.9);
  box-shadow:var(--shadow-md), inset 0 1px 0 #fff;
  display:flex; justify-content:space-between; align-items:center;
}
.hello::after {
  content:""; position:absolute; width:220px; height:220px; right:-40px; top:-80px; pointer-events:none;
  background:radial-gradient(circle, rgba(255,255,255,.75), transparent 68%);
}
.hello-time {
  font-size:48px; font-weight:650; letter-spacing:0.04em; line-height:1.1;
  background:linear-gradient(180deg,#5B9BFF,#3D7EF0);
  -webkit-background-clip:text; background-clip:text; color:transparent;
  filter:drop-shadow(0 8px 14px rgba(61,126,240,.16));
}
.hello-date { font-size:14px; color:var(--muted); margin-top:6px; }
.hello-chip { display:inline-flex; align-items:center; gap:6px; margin-top:12px; background:#E0EEF8; color:#3D7EF0; font-weight:650; border-radius:999px; padding:7px 14px; font-size:13px; border:none; box-shadow:0 6px 14px rgba(90,130,175,.12); }

/* Cards */
.card {
  background:#fff;
  border:none; border-radius:var(--radius);
  padding:20px 22px; margin-bottom:16px; box-shadow:var(--shadow);
  position:relative; overflow:hidden; transition:transform .2s, box-shadow .2s;
}
.card-title { font-size:17px; font-weight:650; margin-bottom:14px; display:flex; align-items:center; justify-content:space-between; color:#3D7EF0; }
.card::before { display:none; }
.card:hover { transform:translateY(-2px); box-shadow:var(--shadow-md); }
.card-title .actions { display:flex; gap:8px; }

/* Forms */
input,select,textarea { font-family:var(--font-kai); font-size:14px; border:1px solid #C5D6E6; border-radius:14px; padding:10px 14px; outline:none; transition:all .15s; background:#EEF4FA; color:var(--text); }
input:focus,select:focus,textarea:focus { border-color:#6AA4FF; background:#fff; box-shadow:0 0 0 3px rgba(58,120,232,0.16); }
textarea { resize:vertical; min-height:60px; }
.form-row { display:flex; gap:8px; flex-wrap:wrap; align-items:center; margin-bottom:12px; }
.form-row input,.form-row select { flex:1; min-width:120px; }

/* Buttons */
.btn { display:inline-flex; align-items:center; gap:6px; padding:7px 14px; border:none; border-radius:999px; background:linear-gradient(180deg,#EEF5FF,#D2E3FA); cursor:pointer; font-size:14px; color:#4C8DFF; transition:all .15s; font-family:var(--font-kai); font-weight:500; box-shadow:0 4px 10px rgba(47,99,201,.08), inset 0 1px 0 #fff; }
.btn:hover { background:linear-gradient(180deg,#E3EEFB,#C0D6F5); transform:translateY(-1px); }
.btn-primary { background:linear-gradient(180deg,#7EB6FF,#4C8DFF); color:#fff; border-color:transparent; box-shadow:0 10px 20px rgba(76,141,255,.28), inset 0 1px 0 rgba(255,255,255,.4); }
.btn-primary:hover { background:linear-gradient(180deg,#6AA4FF,#3D7EF0); color:#fff; }
.btn-sm { padding:4px 12px; font-size:13px; }
.btn-danger { color:var(--red); background:#FFE8E6; }
.btn-danger:hover { border-color:var(--red); }

/* Lists */
.list-item { display:flex; align-items:center; gap:10px; padding:10px 0; border-bottom:1px solid var(--border); }
.list-item:last-child { border-bottom:none; }
.list-item .text { flex:1; }
.list-item .meta { font-size:12px; color:var(--muted); }
.list-item.done .text { text-decoration:line-through; color:var(--muted); }

/* Checkbox */
.cb { width:22px; height:22px; border:2px solid #B4CCE8; border-radius:50%; cursor:pointer; display:flex; align-items:center; justify-content:center; flex-shrink:0; transition:all .15s; background:#fff; }
.cb:hover { border-color:var(--primary); }
.cb.checked { background:var(--primary); border-color:var(--primary); }
.cb.checked::after { content:""; width:6px; height:10px; border:solid #fff; border-width:0 2px 2px 0; transform:rotate(45deg); }

/* Badge */
.badge { display:inline-block; padding:2px 8px; border-radius:10px; font-size:11px; font-weight:500; }
.badge-high { background:var(--red-light); color:var(--red); }
.badge-mid { background:var(--amber-light); color:var(--amber); }
.badge-low { background:var(--green-light); color:var(--green); }
.badge-info { background:var(--primary-light); color:var(--primary); }

/* Stat */
.stat-grid { display:grid; grid-template-columns:repeat(4,1fr); gap:12px; margin-bottom:16px; }
.stat { background:linear-gradient(180deg,#fff,#EEF4FA); border:1px solid rgba(255,255,255,.9); border-radius:var(--radius); padding:18px; text-align:center; box-shadow:var(--shadow), inset 0 1px 0 #fff; }
.ring { width:96px; height:96px; border-radius:50%; display:flex; flex-direction:column; align-items:center; justify-content:center; background:conic-gradient(#7EB6FF calc(var(--p)*1%), #E3EEF8 0); flex-shrink:0; box-shadow:0 10px 22px rgba(126,182,255,.14); }
.feat { text-align:center; cursor:pointer; padding:16px 8px; border-radius:18px; background:#EEF4FA; border:none; box-shadow:0 8px 18px rgba(90,130,175,.08); transition:transform .18s, box-shadow .18s, background .18s; }
.feat:hover { background:#E0ECF8; transform:translateY(-4px); box-shadow:0 14px 28px rgba(90,130,175,.12); }
.stat .num { font-size:26px; font-weight:650; color:#3D7EF0; font-variant-numeric:tabular-nums; }
.stat .label { font-size:12px; color:var(--muted); margin-top:4px; }
.stat .emo { font-size:26px; margin-bottom:6px; }

.check-card { display:flex; gap:20px; align-items:center; }
.ring-inner { width:74px; height:74px; border-radius:50%; background:#fff; display:flex; flex-direction:column; align-items:center; justify-content:center; box-shadow:inset 0 0 0 1px rgba(58,120,232,.08); }
.ring-num { font-size:20px; color:#3D7EF0; font-weight:650; }
.ring-lab { font-size:11px; color:var(--muted); }
.check-grid { display:grid; grid-template-columns:1fr 1fr; gap:10px 18px; flex:1; }
.check-row { display:flex; align-items:center; gap:8px; font-size:15px; }
.streak-pill { background:#FFF4E8; color:#E08A3C; border-radius:999px; padding:4px 10px; font-size:12px; }

.feat-grid { display:grid; grid-template-columns:repeat(4,1fr); gap:14px; }
.feat .emo { font-size:28px; }
.feat .name { font-size:14px; color:#3D7EF0; margin-top:6px; font-weight:650; }
.feat .sub { font-size:12px; color:var(--muted); }

/* Progress */
.progress { height:6px; background:var(--border); border-radius:3px; overflow:hidden; margin:8px 0; }
.progress-bar { height:100%; background:var(--primary); border-radius:3px; transition:width .3s; }

/* DDL card */
.ddl-item { display:flex; align-items:center; gap:12px; padding:10px 12px; border-radius:var(--radius-sm); margin-bottom:8px; background:var(--bg); }
.ddl-item .days { font-size:20px; font-weight:600; text-align:center; min-width:48px; }
.ddl-item .days-label { font-size:11px; color:var(--muted); }
.ddl-item.urgent { background:var(--red-light); }
.ddl-item.urgent .days { color:var(--red); }
.ddl-item.soon { background:var(--amber-light); }
.ddl-item.soon .days { color:var(--amber); }

/* Habit */
.habit-grid { display:grid; grid-template-columns:repeat(auto-fill,minmax(280px,1fr)); gap:12px; }
.habit-card { background:var(--card); border:1px solid var(--border); border-radius:var(--radius); padding:14px; }
.habit-card .top { display:flex; align-items:center; justify-content:space-between; margin-bottom:10px; }
.habit-card .name { font-weight:500; font-size:14px; }
.habit-card .streak { font-size:12px; color:var(--amber); font-weight:500; }
.habit-dots { display:flex; gap:4px; margin:8px 0; }
.habit-dot { width:24px; height:24px; border-radius:6px; border:1px solid var(--border); display:flex; align-items:center; justify-content:center; font-size:10px; color:var(--muted); }
.habit-dot.done { background:var(--green); border-color:var(--green); color:#fff; }
.habit-dot.today { border-color:var(--primary); border-width:2px; }

/* Week plan */
.week-grid { display:grid; grid-template-columns:repeat(7,1fr); gap:8px; }
.week-cell { background:var(--card); border:1px solid var(--border); border-radius:var(--radius-sm); padding:10px; min-height:80px; cursor:pointer; transition:all .15s; }
.week-cell:hover { border-color:var(--primary); }
.week-cell .day-name { font-size:12px; color:var(--muted); }
.week-cell .day-num { font-size:16px; font-weight:600; }
.week-cell.today { border-color:var(--primary); background:var(--primary-light); }

/* Meal grid */
.meal-grid { display:grid; grid-template-columns:100px repeat(7,1fr); gap:1px; background:var(--border); border-radius:var(--radius-sm); overflow:hidden; }
.meal-cell { background:var(--card); padding:8px; font-size:12px; }
.meal-cell.header { background:var(--bg); font-weight:500; text-align:center; }
.meal-cell input { border:none; background:transparent; padding:4px; width:100%; }

/* Paper */
.paper-card { background:var(--card); border:1px solid var(--border); border-radius:var(--radius); padding:14px; margin-bottom:12px; }
.paper-card .title { font-size:14px; font-weight:500; margin-bottom:4px; }
.paper-card .info { font-size:12px; color:var(--muted); margin-bottom:6px; }
.paper-card .notes { font-size:13px; color:var(--text); margin-top:6px; padding:8px; background:var(--bg); border-radius:var(--radius-sm); }

/* Expense */
.expense-chart-wrap { height:260px; margin:12px 0; }

/* Diary */
.mood-picker { display:grid; grid-template-columns:repeat(4,1fr); gap:10px; margin-bottom:12px; }
.mood-btn { font-size:28px; cursor:pointer; padding:14px 8px; border:none; border-radius:16px; background:#F0F6FC; transition:all .15s; text-align:center; box-shadow:none; }
.mood-btn:hover { background:#D2E3FA; }
.mood-btn.selected { background:#C5DBF7; box-shadow:0 0 0 2px #6AA4FF; }

/* Travel */
.trip-card { background:var(--card); border:1px solid var(--border); border-radius:var(--radius); padding:14px; margin-bottom:12px; }
.trip-card .header { display:flex; justify-content:space-between; align-items:start; margin-bottom:8px; }
.trip-card .dest { font-size:15px; font-weight:600; }
.trip-card .dates { font-size:12px; color:var(--muted); }

/* Empty state */
.empty { text-align:center; padding:32px; color:var(--muted); font-size:13px; }

/* Responsive */
@media(max-width:768px){
  :root { --sidebar-w:60px; }
  .nav-item span:not(.nav-icon) { display:none; }
  .feat-grid { grid-template-columns:repeat(2,1fr); }
  .hello-time { font-size:32px; }
  .meal-grid { grid-template-columns:80px repeat(7,minmax(80px,1fr)); overflow-x:auto; }
}

/* Scrollbar */
::-webkit-scrollbar { width:6px; }
::-webkit-scrollbar-thumb { background:#B4CCE8; border-radius:3px; }
::-webkit-scrollbar-track { background:transparent; }

/* Quote box */
.quote-box {
  background:linear-gradient(135deg,#FFFFFF,#E2EEF8);
  border:1px solid rgba(255,255,255,.7); color:#3A4556; border-radius:var(--radius);
  padding:22px 28px; margin-bottom:16px; font-size:18px; line-height:1.85; text-align:center;
  font-family:var(--font-kai); font-weight:650; box-shadow:var(--shadow); position:relative;
}
.quote-box::before { display:none; }
.quote-en { font-style:italic; color:#8AA3C2; font-size:13px; margin-top:6px; }

/* Schedule */
.schedule-block { display:flex; align-items:center; gap:10px; padding:8px 0; border-bottom:1px solid var(--border); }
.schedule-block:last-child { border:none; }
.schedule-time { font-size:12px; color:var(--muted); min-width:80px; }

/* Tabs */
.tabs { display:flex; gap:0; margin-bottom:16px; border-bottom:2px solid var(--border); }
.tab { padding:10px 20px; cursor:pointer; font-size:13px; color:var(--muted); border-bottom:2px solid transparent; margin-bottom:-2px; transition:all .2s; font-weight:500; }
.tab:hover { color:var(--primary); }
.tab.active { color:var(--primary); border-bottom-color:var(--primary); font-weight:600; }

/* Paper fetch */
.paper-fetch-btn { background:var(--primary); color:#fff; border:none; padding:8px 16px; border-radius:var(--radius-sm); cursor:pointer; font-size:13px; font-family:var(--font-kai); display:inline-flex; align-items:center; gap:6px; transition:all .2s; }
.paper-fetch-btn:hover { background:var(--primary-dark); transform:translateY(-1px); }
.paper-fetch-btn:disabled { opacity:.5; cursor:wait; }
.fetch-result { padding:10px; background:var(--primary-light); border-radius:var(--radius-sm); margin:8px 0; font-size:13px; color:var(--primary-dark); display:none; }

/* Meal recipe */
.recipe-section { margin-top:16px; }
.recipe-card { display:flex; align-items:center; gap:10px; padding:10px; border:1px solid var(--border); border-radius:var(--radius-sm); margin-bottom:8px; background:var(--card); }
.recipe-card .rname { flex:1; font-size:13px; }
.recipe-card .rlink { font-size:12px; color:var(--primary); text-decoration:none; }
.recipe-card .rlink:hover { text-decoration:underline; }
.xhs-btn { font-size:12px; padding:4px 10px; border:1px solid var(--border); border-radius:var(--radius-sm); background:var(--card); color:var(--red); cursor:pointer; transition:all .15s; font-family:var(--font-kai); }
.xhs-btn:hover { background:var(--red); color:#fff; border-color:var(--red); }

/* Month plan */
.month-grid { display:grid; grid-template-columns:repeat(7,1fr); gap:4px; }
.month-cell { aspect-ratio:1; border:1px solid var(--border); border-radius:6px; padding:4px; font-size:11px; cursor:pointer; transition:all .15s; min-height:50px; }
.month-cell:hover { border-color:var(--primary); }
.month-cell.today { border-color:var(--primary); background:var(--primary-light); }
.month-cell .mc-num { font-weight:600; }
.month-cell .mc-dot { width:6px; height:6px; border-radius:50%; background:var(--primary); margin-top:2px; }

/* DDL form */
.ddl-add-form { display:flex; gap:8px; flex-wrap:wrap; margin-top:10px; padding-top:10px; border-top:1px solid var(--border); }

/* Projects */
.project-layout { display:flex; gap:16px; min-height:600px; }
.project-sidebar { width:240px; flex-shrink:0; background:var(--card); border:1px solid var(--border); border-radius:var(--radius); padding:14px; box-shadow:var(--shadow); overflow-y:auto; max-height:calc(100vh - 160px); }

function openSync(){ const m=document.getElementById('sync-modal'); if(m) m.hidden=false; }
function closeSync(){ const m=document.getElementById('sync-modal'); if(m) m.hidden=true; }
function strToB64(s){
  const bytes = new TextEncoder().encode(s);
  let bin='';
  bytes.forEach(b=>{ bin += String.fromCharCode(b); });
  return btoa(bin);
}
function b64ToStr(b64){
  const bin = atob(String(b64).replace(/\n/g,''));
  const bytes = Uint8Array.from(bin, c=>c.charCodeAt(0));
  return new TextDecoder().decode(bytes);
}
function collectCloud(){
  const meta = load('__syncmeta', {});
  const keys = {};
  for(let i=0;i<localStorage.length;i++){
    const full = localStorage.key(i);
    if(!full || !full.startsWith(P)) continue;
    const k = full.slice(P.length);
    if(k==='gh_token' || k==='__syncmeta') continue;
    keys[k] = { t:(meta && meta[k]) || 0, v: JSON.parse(localStorage.getItem(full)) };
  }
  return { v:1, keys };
}
function applyCloud(doc){
  cloudQuiet = true;
  const meta = {};
  Object.entries((doc && doc.keys) || {}).forEach(([k,item])=>{
    localStorage.setItem(P+k, JSON.stringify(item.v));
    meta[k] = item.t || 0;
  });
  localStorage.setItem(P+'__syncmeta', JSON.stringify(meta));
  cloudQuiet = false;
}
async function ghContents(method, body){
  const token = ghToken();
  if(!token) return null;
  const res = await fetch('https://api.github.com/repos/'+DATA_REPO+'/contents/data.json', {
    method,
    headers:{
      Authorization:'Bearer '+token,
      Accept:'application/vnd.github+json',
      'Content-Type':'application/json',
      'X-GitHub-Api-Version':'2022-11-28'
    },
    body: body ? JSON.stringify(body) : undefined
  });
  if(res.status===404) return { missing:true };
  const data = await res.json().catch(()=>null);
  if(!res.ok){
    const msg = (data && data.message) || ('同步失败 '+res.status);
    throw new Error(msg);
  }
  return data;
}
async function pullMerge(){
  if(!ghToken()) return;
  setSyncStatus('正在同步…');
  const remoteFile = await ghContents('GET');
  let remote = null;
  if(remoteFile && !remoteFile.missing){
    cloudSha = remoteFile.sha || '';
    remote = JSON.parse(b64ToStr(remoteFile.content));
  }
  if(!remote || !remote.keys){
    await pushCloud();
    refreshSyncLabel();
    return;
  }
  const local = collectCloud();
  const names = new Set([...Object.keys(remote.keys), ...Object.keys(local.keys)]);
  const merged = { v:1, keys:{} };
  let localNewer = false;
  names.forEach(k=>{
    const r = remote.keys[k];
    const l = local.keys[k];
    if(r && l){
      if((l.t||0) > (r.t||0)){ merged.keys[k]=l; localNewer=true; }
      else if((l.t||0) === (r.t||0) && (l.t||0)===0){ merged.keys[k]=l; localNewer=true; }
      else merged.keys[k]=r;
    } else if(l){
      merged.keys[k]=l; localNewer=true;
    } else merged.keys[k]=r;
  });
  applyCloud(merged);
  if(localNewer || remoteFile.missing) await pushCloud();
  else refreshSyncLabel();
}
function scheduleCloudPush(){
  if(!ghToken()) return;
  clearTimeout(cloudTimer);
  cloudTimer = setTimeout(()=>{ pushCloud().catch(e=>setSyncStatus(e.message||'同步失败')); }, 800);
}
async function pushCloud(){
  if(!ghToken()) return;
  const doc = collectCloud();
  const now = Date.now();
  const meta = load('__syncmeta', {});
  const next = (meta && typeof meta==='object' && !Array.isArray(meta)) ? meta : {};
  Object.entries(doc.keys).forEach(([k,item])=>{
    if(!item.t){ item.t = now; next[k] = now; }
  });
  cloudQuiet = true;
  localStorage.setItem(P+'__syncmeta', JSON.stringify(next));
  cloudQuiet = false;
  const payload = JSON.stringify(doc);
  if(payload.length > 900000){ setSyncStatus('内容太大，暂未上传'); return; }
  setSyncStatus('正在保存…');
  if(!cloudSha){
    const cur = await ghContents('GET');
    if(cur && !cur.missing) cloudSha = cur.sha || '';
  }
  const body = { message:'sync workbench', content: strToB64(payload) };
  if(cloudSha) body.sha = cloudSha;
  const saved = await ghContents('PUT', body);
  cloudSha = (saved && saved.content && saved.content.sha) || cloudSha;
  setSyncStatus('已保存到云端');
}
async function connectSync(){
  const input = document.getElementById('sync-token');
  const token = (input && input.value || '').trim();
  if(!token){ setSyncStatus('先粘贴 token'); return; }
  localStorage.setItem(P+'gh_token', token);
  try{
    await pullMerge();
    closeSync();
    switchView(currentView);
  }catch(e){
    localStorage.removeItem(P+'gh_token');
    cloudSha = '';
    setSyncStatus(e.message || '连接失败');
  }
}
function uid(){ return Date.now().toString(36) + Math.random().toString(36).slice(2,6); }
function todayStr(){ const d=new Date(); return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`; }
function dateStr(d){ if(!d) return ''; const dt = typeof d==='string'? new Date(d) : d; return `${dt.getFullYear()}-${String(dt.getMonth()+1).padStart(2,'0')}-${String(dt.getDate()).padStart(2,'0')}`; }
function fmtDate(s){ if(!s) return ''; const [y,m,d]=s.split('-'); return `${m}/${d}`; }
function daysUntil(s){ const t=new Date(s+'T00:00:00'); const n=new Date(todayStr()+'T00:00:00'); return Math.round((t-n)/86400000); }
function addDays(s,n){ const d=new Date(s+'T00:00:00'); d.setDate(d.getDate()+n); return dateStr(d); }

function renderWeekOverview(){
  const el = document.getElementById('week-overview');
  if(!el) return;
  const plans = load('plans',{});
  const today = todayStr();
  const d = new Date();
  const day = d.getDay()===0?7:d.getDay();
  const monday = addDays(today, -(day-1));
  const names=['一','二','三','四','五','六','日'];
  el.innerHTML = names.map((n,i)=>{
    const date = addDays(monday, i);
    const tasks = plans[date]||[];
    const done = tasks.filter(t=>t.done).length;
    const isToday = date===today;
    return `<div class="week-cell ${isToday?'today':''}" onclick="goToPlan('${date}')"><div class="day-name">周${n}</div><div class="day-num">${parseInt(date.split('-')[2])}</div><div style="font-size:11px;color:var(--muted);margin-top:4px">${tasks.length?done+'/'+tasks.length:'-'}</div></div>`;
  }).join('');
}

function goToPlan(date){ currentPlanDate=date; currentPlanTab='day'; switchView('plan'); }

function getStreak(habits){
  if(!habits.length) return 0;
  let max=0;
  habits.forEach(h=>{
    const s=getHabitStreak(h); if(s>max)max=s;
  });
  return max;
}

function getHabitStreak(h){
  const hist=(h.history||[]).sort();
  if(!hist.length) return 0;
  let s=0; let d=new Date(todayStr()+'T00:00:00');
  while(true){
    const ds=dateStr(d);
    if(hist.includes(ds)){ s++; d.setDate(d.getDate()-1); }
    else if(ds===todayStr()){ d.setDate(d.getDate()-1); continue; }
    else break;
  }
  return s;
}

function togglePlanTask(id){
  const plans=load('plans',{});
  const t=plans[todayStr()]||[];
  const task=t.find(x=>x.id===id); if(task) task.done=!task.done;
  save('plans',plans);
  renderDashboard(document.getElementById('content'));
  renderWeekOverview();
}

function toggleHabitToday(id){
  const habits=load('habits',[]);
  const h=habits.find(x=>x.id===id); if(!h) return;
  h.history=h.history||[];
  const t=todayStr();
  const i=h.history.indexOf(t);
  if(i>=0) h.history.splice(i,1); else h.history.push(t);
  save('habits',habits);
  renderDashboard(document.getElementById('content'));
}

function countPages(pages){
  if(!pages||!pages.length) return 0;
  return pages.reduce((n,pg)=>n+1+countPages(pg.pages||[]),0);
}
function ensurePageTree(node){
  if(!node.pages) node.pages = [];
  if(node.notes && !node.pages.length){ node.pages = node.notes; delete node.notes; }
  node.pages.forEach(pg=>{
    if(!pg.files) pg.files = [];
    if(!pg.pages) pg.pages = [];
    ensurePageTree(pg);
  });
}
function getPageByPath(project, path){
  if(!project || !path || !path.length) return null;
  let pages = project.pages || [];
  let cur = null;
  for(const id of path){
    cur = pages.find(x=>x.id===id);
    if(!cur) return null;
    pages = cur.pages || [];
  }
  return cur;
}
function collectFileIds(pages, acc){
  (pages||[]).forEach(pg=>{
    (pg.files||[]).forEach(f=>{ if(f&&f.id) acc.push(f.id); });
    collectFileIds(pg.pages, acc);
  });
}
function mdHtml(src){
  if(!src) return '';
  const boxes = [];
  let s = String(src);
  s = s.replace(/\$\$([\s\S]+?)\$\$/g, function(_, m){ boxes.push(texToHtml(m, true)); return '\u0000M'+(boxes.length-1)+'\u0000'; });
  s = s.replace(/\$([^$\n]+?)\$/g, function(_, m){ boxes.push(texToHtml(m, false)); return '\u0000M'+(boxes.length-1)+'\u0000'; });
  let html = '';
  try{
    if(typeof marked!=='undefined' && typeof marked.parse==='function') html = marked.parse(s, {gfm:true, breaks:true});
    else html = mdLocal(s);
  }catch(e){ html = mdLocal(s); }
  return html.replace(/\u0000M(\d+)\u0000/g, function(_, i){ return boxes[+i]; });
}
function texToHtml(tex, display){
  const t = String(tex||'').trim();
  if(window.katex){
    try{ return katex.renderToString(t, {throwOnError:false, displayMode:!!display}); }catch(e){}
  }
  return liteTex(t, display);
}
function liteTex(tex, display){
  let s = esc(tex);
  const g = {alpha:'α',beta:'β',gamma:'γ',delta:'δ',epsilon:'ε',theta:'θ',lambda:'λ',mu:'μ',pi:'π',sigma:'σ',phi:'φ',omega:'ω',Gamma:'Γ',Delta:'Δ',Theta:'Θ',Lambda:'Λ',Sigma:'Σ',Omega:'Ω',infty:'∞',pm:'±',times:'×',cdot:'·',leq:'≤',geq:'≥',neq:'≠',approx:'≈',in:'∈',subset:'⊂',rightarrow:'→',to:'→',Rightarrow:'⇒',sum:'∑',prod:'∏',int:'∫',partial:'∂',ldots:'…'};
  s = s.replace(/\\frac\{([^{}]+)\}\{([^{}]+)\}/g,'<span class="frac"><span class="frac-n">$1</span><span class="frac-d">$2</span></span>');
  s = s.replace(/\\sqrt\{([^{}]+)\}/g,'√($1)');
  s = s.replace(/\\([a-zA-Z]+)/g, function(_,k){ return g[k] || k; });
  s = s.replace(/\^(\{[^}]+\}|[A-Za-z0-9+\-]+)/g, function(_,e){ return '<sup>'+e.replace(/[{}]/g,'')+'</sup>'; });
  s = s.replace(/_(\{[^}]+\}|[A-Za-z0-9+\-]+)/g, function(_,e){ return '<sub>'+e.replace(/[{}]/g,'')+'</sub>'; });
  return '<span class="'+(display?'math-block':'math-inline')+'">'+s+'</span>';
}
function ensureKatex(){
  if(window.katex) return Promise.resolve();
  if(window._katexLoading) return window._katexLoading;
  window._katexLoading = new Promise(function(res){
    const css = document.createElement('link');
    css.rel = 'stylesheet';
    css.href = 'https://cdn.bootcdn.net/ajax/libs/KaTeX/0.16.9/katex.min.css';
    document.head.appendChild(css);
    const s = document.createElement('script');
    s.src = 'https://cdn.bootcdn.net/ajax/libs/KaTeX/0.16.9/katex.min.js';
    s.onload = function(){ refreshVisibleMath(); res(); };
    s.onerror = function(){
      const s2 = document.createElement('script');
      s2.src = 'https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.js';
      const css2 = document.createElement('link');
      css2.rel='stylesheet';
      css2.href='https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.css';
      document.head.appendChild(css2);
      s2.onload = function(){ refreshVisibleMath(); res(); };
      s2.onerror = function(){ res(); };
      document.head.appendChild(s2);
    };
    document.head.appendChild(s);
  });
  return window._katexLoading;
}
function refreshVisibleMath(){
  const live = document.getElementById('notion-live');
  const ta = document.getElementById('notion-ta');
  if(live && ta) live.innerHTML = mdHtml(ta.value||'') || '<div class="empty">开始书写。公式写成 $x-2$ 即可。</div>';
}
function mdLocal(src){
  let s = String(src).replace(/\r\n/g,'\n');
  const codes = [];
  s = s.replace(/```(\w*)\n([\s\S]*?)```/g, (_, lang, code)=>{
    codes.push('<pre><code>'+esc(code.replace(/\n$/,''))+'</code></pre>');
    return '\u0000C'+ (codes.length-1) +'\u0000';
  });
  const lines = s.split('\n');
  const out = [];
  let i = 0;
  function inline(t){
    t = esc(t);
    t = t.replace(/`([^`]+)`/g,'<code>$1</code>');
    t = t.replace(/!\[([^\]]*)\]\(([^)]+)\)/g,'<img alt="$1" src="$2">');
    t = t.replace(/\[([^\]]+)\]\(([^)]+)\)/g,'<a href="$2" target="_blank" rel="noopener">$1</a>');
    t = t.replace(/\*\*([^*]+)\*\*/g,'<strong>$1</strong>');
    t = t.replace(/__([^_]+)__/g,'<strong>$1</strong>');
    t = t.replace(/\*([^*]+)\*/g,'<em>$1</em>');
    t = t.replace(/(^|\s)_([^_]+)_/g,'$1<em>$2</em>');
    return t;
  }
  while(i<lines.length){
    const line = lines[i];
    const token = line.match(/^\u0000C(\d+)\u0000$/);
    if(token){ out.push(codes[+token[1]]); i++; continue; }
    if(/^\s*\|.+\|\s*$/.test(line) && i+1<lines.length && /^\s*\|?\s*[-:| ]+\s*\|/.test(lines[i+1])){
      const rows = [];
      while(i<lines.length && /^\s*\|/.test(lines[i])){
        if(/^\s*\|?\s*[-:| ]+\s*\|/.test(lines[i]) && rows.length===1){ i++; continue; }
        rows.push(lines[i].replace(/^\s*\|/,'').replace(/\|\s*$/,'').split('|').map(c=>c.trim()));
        i++;
      }
      const head = rows.shift()||[];
      let table = '<table><thead><tr>'+head.map(c=>'<th>'+inline(c)+'</th>').join('')+'</tr></thead><tbody>';
      rows.forEach(r=>{ table += '<tr>'+r.map(c=>'<td>'+inline(c)+'</td>').join('')+'</tr>'; });
      out.push(table+'</tbody></table>');
      continue;
    }
    const h = line.match(/^(#{1,6})\s+(.+)$/);
    if(h){ out.push('<h'+h[1].length+'>'+inline(h[2])+'</h'+h[1].length+'>'); i++; continue; }
    if(/^\s*---+\s*$/.test(line) || /^\s*\*\*\*+\s*$/.test(line)){ out.push('<hr>'); i++; continue; }
    if(/^\s*>\s?/.test(line)){
      const qs=[];
      while(i<lines.length && /^\s*>\s?/.test(lines[i])){ qs.push(lines[i].replace(/^\s*>\s?/,'')); i++; }
      out.push('<blockquote>'+qs.map(inline).join('<br>')+'</blockquote>');
      continue;
    }
    if(/^\s*[-*+]\s+/.test(line)){
      const items=[];
      while(i<lines.length && /^\s*[-*+]\s+/.test(lines[i])){ items.push('<li>'+inline(lines[i].replace(/^\s*[-*+]\s+/,''))+'</li>'); i++; }
      out.push('<ul>'+items.join('')+'</ul>');
      continue;
    }
    if(/^\s*\d+\.\s+/.test(line)){
      const items=[];
      while(i<lines.length && /^\s*\d+\.\s+/.test(lines[i])){ items.push('<li>'+inline(lines[i].replace(/^\s*\d+\.\s+/,''))+'</li>'); i++; }
      out.push('<ol>'+items.join('')+'</ol>');
      continue;
    }
    if(!line.trim()){ i++; continue; }
    const para=[];
    while(i<lines.length && lines[i].trim() && !/^(#{1,6}\s|```|\s*[-*+]\s|\s*\d+\.\s|\s*>|\s*---)/.test(lines[i]) && !/^\u0000C/.test(lines[i])){
      para.push(lines[i]); i++;
    }
    out.push('<p>'+para.map(inline).join('<br>')+'</p>');
  }
  return out.join('');
}
function openFilesDB(){
  return new Promise((resolve,reject)=>{
    if(!window.indexedDB){ reject(new Error('no idb')); return; }
    const req = indexedDB.open('ww_workbench_files', 1);
    req.onupgradeneeded = ()=>{ const db=req.result; if(!db.objectStoreNames.contains('files')) db.createObjectStore('files'); };
    req.onsuccess = ()=> resolve(req.result);
    req.onerror = ()=> reject(req.error);
  });
}
async function idbPutFile(id, dataUrl){
  try{
    const db = await openFilesDB();
    await new Promise((res,rej)=>{
      const tx = db.transaction('files','readwrite');
      tx.oncomplete = ()=>res();
      tx.onerror = ()=>rej(tx.error);
      tx.objectStore('files').put(dataUrl, id);
    });
    return true;
  }catch{ return false; }
}
async function idbGetFile(id){
  try{
    const db = await openFilesDB();
    return await new Promise((res,rej)=>{
      const tx = db.transaction('files','readonly');
      const rq = tx.objectStore('files').get(id);
      rq.onsuccess = ()=> res(rq.result||'');
      rq.onerror = ()=> rej(rq.error);
    });
  }catch{ return ''; }
}
async function idbDelFile(id){
  try{
    const db = await openFilesDB();
    await new Promise((res,rej)=>{
      const tx = db.transaction('files','readwrite');
      tx.oncomplete = ()=>res();
      tx.onerror = ()=>rej(tx.error);
      tx.objectStore('files').delete(id);
    });
  }catch{}
}
async function resolveFileUrl(file){
  if(file.dataUrl) return file.dataUrl;
  return await idbGetFile(file.id);
}

function saveNotionUrl(){
  const inp = document.getElementById('notion-url');
  if(!inp) return;
  const url = inp.value.trim();
  const projects = load('projects', []);
  const p = projects.find(x => x.id === currentProjectId);
  if(!p) return;
  if(!currentPagePath.length) p.notionUrl = url;
  else {
    const pg = getPageByPath(p, currentPagePath);

  save('projects', projects);
  currentDocTab = 'notion';

  if(currentView==='projectDetail') renderProjectDetail(c);

function delSubPage(){
  if(!confirm('确定删除这个页面及其全部子页面？内容不可恢复。')) return;
  const projects = load('projects', []);
  const p = projects.find(x => x.id === currentProjectId);
  if(!p) return;
  const ids = [];
  const doomed = getPageByPath(p, currentPagePath);
  collectFileIds(doomed ? [doomed] : [], ids);
  ids.forEach(idbDelFile);
  if(currentPagePath.length===1){
    p.pages = (p.pages||[]).filter(x=>x.id!==currentPagePath[0]);
    currentPagePath = [];
    p.updatedAt = todayStr();
    save('projects', projects);
    renderProjectDetail(document.getElementById('content'));
    return;
  }
  const parent = getPageByPath(p, currentPagePath.slice(0,-1));
  const last = currentPagePath[currentPagePath.length-1];
  if(parent) parent.pages = (parent.pages||[]).filter(x=>x.id!==last);
  p.updatedAt = todayStr();
  save('projects', projects);
  currentPagePath = currentPagePath.slice(0,-1);
  renderProjectPage(document.getElementById('content'));
}

function handleFileUpload(input){
  const files = input.files;
  if(!files || !files.length) return;
  const projects = load('projects', []);
  const p = projects.find(x => x.id === currentProjectId);
  if(!p) return;
  const pg = getPageByPath(p, currentPagePath);
  if(!pg) return;
  if(!pg.files) pg.files = [];
  let pending = files.length;
  const done = ()=>{
    pending--;
    if(pending<=0){
      pg.updatedAt = todayStr();
      p.updatedAt = todayStr();
      save('projects', projects);
      renderProjectPage(document.getElementById('content'));
    }
  };
  for(let file of files){
    if(file.size > 25*1024*1024){
      alert('文件「'+file.name+'」超过 25MB，已跳过。');
      done();
      continue;
    }
    const reader = new FileReader();
    reader.onload = async function(e){
      const rec = {id:uid(), name:file.name, type:file.type, size:file.size};
      const ok = await idbPutFile(rec.id, e.target.result);
      if(!ok) rec.dataUrl = e.target.result;
      pg.files.push(rec);
      done();
    };
    reader.onerror = function(){ done(); };
    reader.readAsDataURL(file);
  }
}

async function viewFile(fileId){
  const projects = load('projects', []);
  const p = projects.find(x => x.id === currentProjectId);
  const pg = getPageByPath(p, currentPagePath);
  const f = (pg&&pg.files||[]).find(x=>x.id===fileId);
  if(!f) return;
  const url = await resolveFileUrl(f);
  if(!url){ alert('找不到文件数据'); return; }
  const root = document.getElementById('file-viewer-root');
  if(!root){ window.open(url, '_blank'); return; }
  const isImg = (f.type||'').startsWith('image/');
  const isPdf = f.type==='application/pdf' || /\.pdf$/i.test(f.name);
  const body = isImg ? `<img src="${url}" alt="${esc(f.name)}">`
    : isPdf ? `<iframe src="${url}"></iframe>`
    : `<iframe src="${url}"></iframe>`;
  root.innerHTML = `<div class="file-viewer" onclick="if(event.target.classList.contains('file-viewer'))closeFileViewer()">
    <div class="file-viewer-inner">
      <div class="file-viewer-bar"><span>${esc(f.name)}</span><button class="btn btn-sm" onclick="closeFileViewer()">关闭</button></div>
      <div class="file-viewer-body">${body}</div>
    </div>
  </div>`;
}

async function downloadFile(fileId){

function delFile(fileId){

function getFileIcon(type){
  if(!type) return ico('file',16);
  if(type.startsWith('image/')) return ico('image',16);
  if(type === 'application/pdf') return ico('scroll',16);
  if(type.startsWith('text/')) return ico('file',16);
  return ico('file',16);
}
function formatFileSize(bytes){
  if(!bytes) return '0 B';
  if(bytes < 1024) return bytes + ' B';
  if(bytes < 1024*1024) return (bytes/1024).toFixed(1) + ' KB';
  return (bytes/1024/1024).toFixed(1) + ' MB';
}

async function fetchArxivPapers(){
  const btn=document.getElementById('fetch-btn');
  const result=document.getElementById('fetch-result');
  if(!btn) return;
  btn.disabled=true; btn.textContent='获取中...';
  result.style.display='block'; result.textContent='正在从 arXiv 获取最新论文...';
  const cat=document.getElementById('pp-cat')?document.getElementById('pp-cat').value:'cs.AI';
  const url=`https://export.arxiv.org/api/query?search_query=cat:${cat}&sortBy=submittedDate&sortOrder=descending&max_results=8`;
  try{
    const res=await fetch(url);
    const xml=await res.text();
    const doc=new DOMParser().parseFromString(xml,'text/xml');
    const entries=doc.querySelectorAll('entry');
    const papers=load('papers',[]);
    const existing=new Set(papers.map(p=>p.title.toLowerCase()));
    let added=0;
    entries.forEach(e=>{
      const titleEl=e.querySelector('title');
      let title=titleEl?titleEl.textContent.trim():'';
      if(title.startsWith('Paper')) title=title.replace(/^Paper\s*\w*\s*/,'').trim();
      if(existing.has(title.toLowerCase())) return;
      const authors=[...e.querySelectorAll('author name')].map(a=>a.textContent.trim()).join(', ');
      const publishedEl=e.querySelector('published');
      let pd=publishedEl?publishedEl.textContent.slice(0,10):todayStr();
      const linkEl=e.querySelector('link');
      const link=linkEl?linkEl.getAttribute('href'):'';
      papers.push({id:uid(),title,authors,publishedDate:pd,status:'未读',tags:[cat],notes:link?'链接: '+link:'',addedDate:todayStr()});
      existing.add(title.toLowerCase());
      added++;
    });
    save('papers',papers);
    result.textContent=`成功获取 ${added} 篇新论文（共 ${entries.length} 篇结果，${entries.length-added} 篇已存在）`;
    result.style.background='var(--green-light)'; result.style.color='#065f46';
    renderPaperList(papers,paperFilter);
  }catch(err){
    result.textContent='获取失败: '+err.message+'。arXiv API 可能暂时不可用，请稍后重试。';
    result.style.background='var(--red-light)'; result.style.color='#991b1b';
  }
  btn.disabled=false; btn.textContent='自动获取最新论文';
}

function updatePaperStatus(id,status){
  const papers=load('papers',[]);
  const p=papers.find(x=>x.id===id); if(p) p.status=status;
  save('papers',papers);
  renderPaperList(load('papers',[]),paperFilter);
}

function editPaperNote(id){
  const papers=load('papers',[]);
  const p=papers.find(x=>x.id===id); if(!p) return;
  const note=prompt('论文笔记',p.notes||'');
  if(note!==null){ p.notes=note; save('papers',papers); renderPaperList(load('papers',[]),paperFilter); }
}
function editPaper(id){
  const p=load('papers',[]).find(x=>x.id===id); if(!p) return;
  openEdit('编辑论文', [
    {key:'title', label:'标题', value:p.title},
    {key:'authors', label:'作者', value:p.authors||''},
    {key:'publishedDate', label:'日期', type:'date', value:p.publishedDate||''}
  ], v=>{
    const title=v.title.trim(); if(!title) return;
    const papers=load('papers',[]); const item=papers.find(x=>x.id===id); if(!item) return;
    item.title=title; item.authors=v.authors.trim(); item.publishedDate=v.publishedDate;
    save('papers',papers); renderPaperList(load('papers',[]),paperFilter);
  });
}

function delPaper(id){
  const papers=load('papers',[]).filter(x=>x.id!==id);
  save('papers',papers);
  renderPaperList(papers,paperFilter);
}

// ============ EXPENSE ============
let expenseChart=null;
function loadChartLib(){
  if(typeof Chart!=='undefined') return Promise.resolve();
  return new Promise((resolve)=>{
    const s=document.createElement('script');
    s.src='https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js';
    s.onload=()=>resolve();
    s.onerror=()=>resolve();
    document.head.appendChild(s);
  });
}
function paintExpenseChart(byCat){
  const ctx=document.getElementById('expense-chart');
  if(!ctx || typeof Chart==='undefined') return;
  const data=Object.entries(byCat).filter(([k,v])=>v>0);
  if(expenseChart){ try{ expenseChart.destroy(); }catch(e){} expenseChart=null; }
  if(!data.length) return;
  expenseChart=new Chart(ctx,{
    type:'doughnut',
    data:{
      labels:data.map(d=>d[0]),
      datasets:[{data:data.map(d=>d[1]),backgroundColor:['#2f3f4f','#4f6b52','#b08948','#7a3b44','#6b5c8a','#3d6b7a','#8a5a4a','#64748b']}]
    },
    options:{responsive:true,maintainAspectRatio:false,plugins:{legend:{position:'right',labels:{font:{size:12,family:'Kaiti SC, KaiTi, serif'}}}}}
  });
}
function renderExpense(c){
  const expenses=load('expenses',[]);
  const now=new Date();
  const ym=`${now.getFullYear()}-${String(now.getMonth()+1).padStart(2,'0')}`;
  const monthExp=expenses.filter(e=>e.date.startsWith(ym));
  const total=monthExp.reduce((s,e)=>s+e.amount,0);
  const cats=['餐饮','交通','购物','学习','娱乐','住房','医疗','其他'];
  const byCat={};
  monthExp.forEach(e=>{ byCat[e.category]=(byCat[e.category]||0)+e.amount; });

  c.innerHTML=`
    <div class="stat-grid" style="grid-template-columns:repeat(3,1fr)">
      <div class="stat"><div class="num">¥${total}</div><div class="label">本月支出</div></div>
      <div class="stat"><div class="num">${monthExp.length}</div><div class="label">本月笔数</div></div>
      <div class="stat"><div class="num">¥${monthExp.length?Math.round(total/monthExp.length):0}</div><div class="label">平均每笔</div></div>
    </div>
    <div class="card">
      <div class="card-title">本月分类占比</div>
      <div class="expense-chart-wrap"><canvas id="expense-chart"></canvas></div>
    </div>
    <div class="card">
      <div class="card-title">添加支出</div>
      <div class="form-row">
        <input id="ex-amount" type="number" placeholder="金额" style="max-width:100px" onkeydown="if(event.key==='Enter')addExpense()">
        <select id="ex-cat" style="max-width:100px">${cats.map(c=>`<option>${c}</option>`).join('')}</select>
        <input id="ex-note" placeholder="备注" onkeydown="if(event.key==='Enter')addExpense()">
        <input id="ex-date" type="date" value="${todayStr()}" style="max-width:150px">
        <button class="btn btn-primary" onclick="addExpense()">添加</button>
      </div>
    </div>
    <div class="card">
      <div class="card-title">支出明细</div>
      ${expenses.length? expenses.sort((a,b)=>b.date.localeCompare(a.date)).slice(0,30).map(e=>`<div class="list-item" ${rowOpen(`editExpense('${e.id}')`)}><span class="badge badge-info">${e.category}</span><div class="text">${esc(e.note||'未备注')}</div><div class="meta">¥${e.amount} · ${fmtDate(e.date)}</div>${editBtn(`editExpense('${e.id}')`)}<button class="btn btn-sm btn-danger" onclick="delExpense('${e.id}')">删除</button></div>`).join('') : '<div class="empty">还没有记账记录</div>'}
    </div>
  `;

  loadChartLib().then(()=>paintExpenseChart(byCat));
}

function addExpense(){
  const amount=parseFloat(document.getElementById('ex-amount').value);
  if(!amount) return;
  const expenses=load('expenses',[]);
  expenses.push({id:uid(),date:document.getElementById('ex-date').value||todayStr(),amount,category:document.getElementById('ex-cat').value,note:document.getElementById('ex-note').value.trim()});
  save('expenses',expenses);
  renderExpense(document.getElementById('content'));
}

function delExpense(id){
  const expenses=load('expenses',[]).filter(x=>x.id!==id);
  save('expenses',expenses);
  renderExpense(document.getElementById('content'));
}
function editExpense(id){
  const e=load('expenses',[]).find(x=>x.id===id); if(!e) return;
  const cats=['餐饮','交通','购物','学习','娱乐','住房','医疗','其他'].map(c=>({value:c,label:c}));
  openEdit('编辑支出', [
    {key:'amount', label:'金额', type:'number', value:e.amount},
    {key:'category', label:'分类', type:'select', value:e.category, options:cats},
    {key:'note', label:'备注', value:e.note||''},
    {key:'date', label:'日期', type:'date', value:e.date}
  ], v=>{
    const amount=parseFloat(v.amount); if(!amount) return;
    const expenses=load('expenses',[]); const item=expenses.find(x=>x.id===id); if(!item) return;
    item.amount=amount; item.category=v.category; item.note=v.note.trim(); item.date=v.date||item.date;
    save('expenses',expenses); renderExpense(document.getElementById('content'));
  });
}

// ============ DIARY ============
function renderDiary(c){
  const diary=load('diary',[]);
  const today=diary.find(d=>d.date===todayStr());
  const moods=['😄','🙂','😌','😐','😢','😠','🤭','😟'];
  const moodLabels=['开心','不错','平静','一般','难过','生气','害羞','低落'];
  const quotes=['今天的你，比昨天更好了一点。','不是每一天都好，但每一天都有好的东西。','允许自己有不好的日子。','坚持本身就是一种天赋。','慢慢来，不要急。','你已经在进步了，只是还没看到结果。','今天的努力，是明天的底气。'];

  c.innerHTML=`
    <div class="quote-box">${quotes[Math.floor(Math.random()*quotes.length)]}</div>
    <div class="card">
      <div class="card-title">${today?'今日日记':'写今日日记'}</div>
      <div class="mood-picker">
        ${moods.map((m,i)=>`<div class="mood-btn ${today&&today.mood===m?'selected':''}" data-mood="${m}" data-label="${moodLabels[i]}" onclick="selectMood(this)">${m}<div style="font-size:10px;color:var(--muted)">${moodLabels[i]}</div></div>`).join('')}
      </div>
      <textarea id="diary-content" placeholder="今天发生了什么？有什么感受？" style="width:100%;min-height:120px;margin-bottom:12px">${esc(today?today.content:'')}</textarea>
      <button class="btn btn-primary" onclick="saveDiary()">保存</button>
    </div>
    <div class="card">
      <div class="card-title">日记历史</div>
      ${diary.length? diary.sort((a,b)=>b.date.localeCompare(a.date)).map(d=>`<div class="list-item" style="align-items:flex-start" ${rowOpen(`editDiary('${d.id}')`)}><div style="font-size:20px">${d.mood||''}</div><div class="text"><div style="font-weight:500">${fmtDate(d.date)}</div><div style="font-size:13px;color:var(--muted);margin-top:2px;white-space:pre-wrap">${esc(d.content)}</div></div>${editBtn(`editDiary('${d.id}')`)}<button class="btn btn-sm btn-danger" onclick="delDiary('${d.id}')">删除</button></div>`).join('') : '<div class="empty">还没有写过日记</div>'}
    </div>
  `;
  if(today) window._selectedMood=today.mood; else window._selectedMood=null;
}

function selectMood(el){
  document.querySelectorAll('.mood-btn').forEach(b=>b.classList.remove('selected'));
  el.classList.add('selected');
  window._selectedMood=el.dataset.mood;
}

function saveDiary(){
  const content=document.getElementById('diary-content').value.trim();
  const mood=window._selectedMood;
  const diary=load('diary',[]);
  let entry=diary.find(d=>d.date===todayStr());
  if(entry){ entry.content=content; entry.mood=mood; }
  else { diary.push({id:uid(),date:todayStr(),mood,content}); }
  save('diary',diary);
  renderDiary(document.getElementById('content'));
}

function delDiary(id){
  const diary=load('diary',[]).filter(x=>x.id!==id);
  save('diary',diary);
  renderDiary(document.getElementById('content'));
}
function editDiary(id){
  const d=load('diary',[]).find(x=>x.id===id); if(!d) return;
  const moods=['😄','🙂','😌','😐','😢','😠','🤭','😟'];
  const labels=['开心','不错','平静','一般','难过','生气','害羞','低落'];
  openEdit('编辑日记', [
    {key:'mood', label:'心情', type:'select', value:d.mood||moods[0], options:moods.map((m,i)=>({value:m,label:m+' '+labels[i]}))},
    {key:'content', label:'内容', type:'textarea', value:d.content||''},
    {key:'date', label:'日期', type:'date', value:d.date}
  ], v=>{
    const diary=load('diary',[]); const item=diary.find(x=>x.id===id); if(!item) return;
    item.mood=v.mood; item.content=v.content; item.date=v.date||item.date;
    save('diary',diary); renderDiary(document.getElementById('content'));
  });
}

// ============ HELPERS ============
function esc(s){ return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }
function pLabel(p){ return p==='high'?'高优先':p==='mid'?'中优先':'低优先'; }
function pBadge(p){ return `<span class="badge ${p==='high'?'badge-high':p==='mid'?'badge-mid':'badge-low'}">${pLabel(p)}</span>`; }

async function boot(){
  try{
    if(ghToken()) await pullMerge();
  }catch(e){
    console.error(e);
    setSyncStatus(e.message || '同步失败');
  }
  try { init(); } catch (e) {
    console.error(e);
    var c = document.getElementById('content');
    if (c) c.innerHTML = '<div class="card"><div class="card-title">载入失败</div><p>'+esc(e && e.message)+'</p></div>';
  }
}
boot();
</script>
